name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Seguridad y zero-log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analisis de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      - name: Validacion de workflows (actionlint)
        uses: raven-actions/actionlint@v1
      - name: Auditoria zero-log (patrones prohibidos)
        run: |
          if grep -rnE 'log\.(Info|Debug|Warn|Printf)|slog\.(Info|Debug|Warn)|console\.log' services apps | grep -E 'subject|recipient|sender|plaintext|body'; then
            echo "::error::Patron de log prohibido detectado (ADR-005)"
            exit 1
          fi

  docs:
    name: Documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx markdownlint-cli2 "README.md" "MAP.md" "docs/**/*.md" "DECISIONS/**/*.md"

  web:
    name: Web (typecheck, lint, tests)
    runs-on: ubuntu-latest
    if: \${{ hashFiles('apps/web/**') != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --coverage

  go:
    name: Go (lint, tests con -race)
    runs-on: ubuntu-latest
    if: \${{ hashFiles('services/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services
      - name: Pruebas unitarias y de integracion
        working-directory: services
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: Vulnerabilidades de dependencias
        working-directory: services
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
