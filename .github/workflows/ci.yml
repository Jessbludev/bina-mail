name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Seguridad y zero-log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analisis de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validacion de workflows (actionlint)
        uses: raven-actions/actionlint@v1
      - name: Auditoria zero-log (patrones prohibidos)
        run: |
          if grep -rnE 'log\.(Info|Debug|Warn|Printf)|slog\.(Info|Debug|Warn)|console\.log' services apps | grep -E 'subject|recipient|sender|plaintext|body'; then
            echo "::error::Patron de log prohibido detectado (ADR-005)"
            exit 1
          fi

  docs:
    name: Documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx markdownlint-cli2 "README.md" "MAP.md" "SNAPSHOT_v*.md" "docs/**/*.md" "DECISIONS/**/*.md"

  contracts:
    name: Contratos protobuf
    runs-on: ubuntu-latest
    if: ${{ hashFiles('packages/contracts/proto/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        working-directory: packages/contracts
        run: buf lint

  go:
    name: Go (lint, tests con -race)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/go.sum') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services
      - name: Pruebas unitarias y de integracion
        working-directory: services
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: Vulnerabilidades de dependencias
        working-directory: services
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lockfiles:
    name: Lockfiles (genera pnpm-lock.yaml y go.sum si faltan)
    runs-on: ubuntu-latest
    if: ${{ (hashFiles('apps/web/package.json') != '' && hashFiles('apps/web/pnpm-lock.yaml') == '') || (hashFiles('services/go.mod') != '' && hashFiles('services/go.sum') == '') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Generar pnpm-lock.yaml
        if: ${{ hashFiles('apps/web/pnpm-lock.yaml') == '' }}
        working-directory: apps/web
        run: pnpm install --lockfile-only
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Generar go.sum (cierra DEBT-003)
        if: ${{ hashFiles('services/go.sum') == '' }}
        working-directory: services
        run: go mod tidy
      - name: Confirmar lockfiles al repositorio
        run: |
          git config user.name "bina-ci"
          git config user.email "ci@bina-mail.local"
          git add apps/web/pnpm-lock.yaml services/go.sum
          if git diff --cached --quiet; then
            echo "sin lockfiles nuevos que confirmar"
            exit 0
          fi
          git commit -m "chore: genera lockfiles (pnpm-lock.yaml, go.sum)"
          git push

  web:
    name: Web (typecheck, lint, tests)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/pnpm-lock.yaml') != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --coverage
