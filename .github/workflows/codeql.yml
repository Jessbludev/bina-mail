# CodeQL: analisis estatico de codigo (SAST) para actions, go y web.
# Ejecuta en cada push y PR a main, y semanalmente sobre la ultima main.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: "Analisis (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      # Publicacion de resultados de code scanning.
      security-events: write
      # Lectura de packs internos y contexto del repositorio privado.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
