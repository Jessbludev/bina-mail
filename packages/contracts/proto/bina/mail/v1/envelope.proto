syntax = "proto3";

package bina.mail.v1;

// Sobre cifrado E2EE. El servidor nunca ve su contenido en claro (ADR-004).
message Envelope {
  string id = 1;
  string sender_fingerprint = 2;
  string recipient_fingerprint = 3;
  bytes nonce = 4;
  bytes ciphertext = 5;
  repeated EnvelopeWrap wraps = 6;
  string blake3_fingerprint = 7;
  int64 created_at_unix = 8;
}

// Clave efímera envuelta para un destinatario (X25519 + HKDF-SHA256).
message EnvelopeWrap {
  string recipient_key_id = 1;
  bytes ephemeral_public_key = 2;
  bytes wrapped_key = 3;
}

// Servicio interno de buzón (gRPC entre gateway y mailbox, ADR-001).
service MailboxService {
  rpc StoreEnvelope(StoreEnvelopeRequest) returns (StoreEnvelopeResponse);
  rpc ListEnvelopes(ListEnvelopesRequest) returns (ListEnvelopesResponse);
}

message StoreEnvelopeRequest {
  Envelope envelope = 1;
}

message StoreEnvelopeResponse {
  string id = 1;
}

message ListEnvelopesRequest {
  string recipient_fingerprint = 1;
  uint32 limit = 2;
}

message ListEnvelopesResponse {
  repeated Envelope envelopes = 1;
}
